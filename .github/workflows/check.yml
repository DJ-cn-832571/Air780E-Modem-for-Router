name: Test and build
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=files/usr/lib/air780e python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py && python3 scripts/build-feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-build
          path: dist/
